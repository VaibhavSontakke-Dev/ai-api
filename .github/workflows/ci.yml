name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm audit --audit-level=high
      - name: Postman collection
        run: |
          npm start > stack.log 2>&1 &
          timeout 30 sh -c 'until curl -sf localhost:4000/healthz; do sleep 1; done'
          npm run postman
  single-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: docker compose up
        run: |
          docker compose up --build -d
          timeout 90 sh -c 'until curl -sf localhost:4000/healthz; do sleep 2; done'
          docker compose down
      - name: make run
        run: |
          make run > make.log 2>&1 &
          timeout 120 sh -c 'until curl -sf localhost:4000/healthz; do sleep 2; done'
